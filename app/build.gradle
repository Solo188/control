plugins {
    id 'com.android.application'
}

// ─── Секреты из gradle.properties или переменных среды ───
def botToken   = System.getenv("BOT_TOKEN")   ?: project.findProperty("BOT_TOKEN")   ?: "YOUR_BOT_TOKEN"
def miniAppUrl = System.getenv("MINI_APP_URL") ?: project.findProperty("MINI_APP_URL") ?: "https://your-username.github.io/your-repo/miniapp/"

android {
    namespace 'com.remotecontrol'
    compileSdk 34

    defaultConfig {
        applicationId "com.remotecontrol"
        minSdk 31           // Android 12 — минимум (MediaProjection FGS type)
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Токен и URL передаются в BuildConfig
        buildConfigField "String", "BOT_TOKEN",   "\"${botToken}\""
        buildConfigField "String", "MINI_APP_URL", "\"${miniAppUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false   // Включи ProGuard если нужна обфускация
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug  // Замени на release keystore
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Убираем предупреждения о дублирующихся ресурсах OkHttp
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE',
                         'META-INF/LICENSE.txt', 'META-INF/NOTICE',
                         'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    // OkHttp для Telegram Bot API
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // AndroidX Core / AppCompat (для NotificationCompat и AppCompatActivity)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'

    // JSON — используем встроенный org.json (нет нужды в доп. зависимости)
}
